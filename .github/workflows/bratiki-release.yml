name: Bratiki isolated signing and release
run-name: Bratiki release build run ${{ inputs.run_id }} revision ${{ inputs.revision }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Bratiki unsigned build workflow run ID from main'
        required: true
        type: string
      revision:
        description: 'Expected revision of selected artifact (2..998)'
        required: true
        type: number
        default: 2
permissions: {}
concurrency:
  group: bratiki-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'patchedronin/Rawline-Bratiki'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      # No checkout: no source code from the selected run is ever executed here.
      - name: Validate trusted workflow provenance and extract bounded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REVISION: ${{ inputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, urllib.request, zipfile
          from pathlib import Path
          repo, run_id = os.environ['REPOSITORY'], os.environ['RUN_ID']
          assert repo == 'patchedronin/Rawline-Bratiki' and re.fullmatch(r'[0-9]+', run_id)
          revision = int(os.environ['REVISION'])
          assert 2 <= revision <= 998
          def api(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          run = api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['repository']['full_name'] == repo and run['head_repository']['full_name'] == repo
          assert run['head_branch'] == 'main' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] in ('push', 'workflow_dispatch')
          workflow = api(f'repos/{repo}/actions/workflows/{run["workflow_id"]}')
          assert workflow['path'] == '.github/workflows/bratiki-build.yml'
          assert run['path'] == '.github/workflows/bratiki-build.yml'
          sha = run['head_sha']
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          artifacts = api(f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          assert artifacts['total_count'] <= 100
          matches = [a for a in artifacts['artifacts'] if a['name'] == 'bratiki-unsigned' and not a['expired']]
          assert len(matches) == 1 and matches[0]['workflow_run']['head_sha'] == sha
          artifact = matches[0]
          assert 0 < artifact['size_in_bytes'] < 600_000_000
          request = urllib.request.Request(artifact['archive_download_url'], headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          class ArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(request, fp, code, msg, headers, newurl)
                  if not newurl.startswith('https://api.github.com/'):
                      redirected.remove_header('Authorization')
                  return redirected
          with urllib.request.build_opener(ArtifactRedirect()).open(request, timeout=180) as response:
              archive_data = response.read(600_000_001)
          assert len(archive_data) <= 600_000_000
          if artifact.get('digest'):
              assert artifact['digest'] == 'sha256:' + hashlib.sha256(archive_data).hexdigest()
          with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
              assert sorted(archive.namelist()) == ['build-metadata.json', 'unsigned-arm64-v8a.apk']
              assert archive.getinfo('build-metadata.json').file_size < 65536
              assert archive.getinfo('unsigned-arm64-v8a.apk').file_size < 600_000_000
              meta = json.loads(archive.read('build-metadata.json'))
              unsigned = archive.read('unsigned-arm64-v8a.apk')
          assert meta['schema'] == 1 and meta['repository'] == repo and meta['sourceSha'] == sha
          assert str(meta['runId']) == run_id and int(meta['runAttempt']) == run['run_attempt']
          assert meta['revision'] == revision and meta['packageName'] == 'app.rawline.mobile'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', meta['versionName'])
          assert meta['signerSha256'] == 'b3729dc9e7538e42f95e96b8f61c400ad9f4e39d309b23c7e4594043fd0e134c'
          assert meta['unsignedSize'] == len(unsigned) and meta['unsignedSha256'] == hashlib.sha256(unsigned).hexdigest()
          def source(path):
              return base64.b64decode(api(f'repos/{repo}/contents/{path}?ref={sha}')['content']).decode()
          pin = json.loads(source('bratiki/upstream.json'))
          props = dict(line.strip().split('=', 1) for line in source('nb4a.properties').splitlines()
                       if '=' in line and not line.lstrip().startswith('#'))
          assert meta['upstream'] == pin and meta['versionName'] == pin['versionName'] == props['VERSION_NAME']
          assert meta['versionCode'] == int(props['VERSION_CODE']) * 1000 + revision
          assert pin['versionIndex'] == int(props['VERSION_CODE'])
          assert pin['coreRef'] == props.get('THRONE_AAR_REF', props.get('THRONE_CORE_REF'))
          assert meta['minSdk'] == pin['minSdk'] == 24
          output = Path('validated')
          output.mkdir()
          (output / 'unsigned-arm64-v8a.apk').write_bytes(unsigned)
          (output / 'build-metadata.json').write_text(json.dumps(meta, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: bratiki-validated
          path: validated/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bratiki-validated
          path: validated
      - name: Install SDK tools without checking out project source
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Sign, independently verify APK identity, and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          SELECTED_RUN_ID: ${{ inputs.run_id }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, tempfile, urllib.error, urllib.request, zipfile
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          assert repo == 'patchedronin/Rawline-Bratiki'
          meta = json.loads(Path('validated/build-metadata.json').read_text())
          assert meta['repository'] == repo and str(meta['runId']) == os.environ['SELECTED_RUN_ID']
          assert meta['revision'] == int(os.environ['EXPECTED_REVISION']) and 2 <= meta['revision'] <= 998
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', meta['versionName'])
          assert re.fullmatch(r'[a-f0-9]{40}', meta['sourceSha'])
          expected_signer = 'b3729dc9e7538e42f95e96b8f61c400ad9f4e39d309b23c7e4594043fd0e134c'
          assert meta['signerSha256'] == expected_signer
          apk = Path('validated/unsigned-arm64-v8a.apk')
          def sha256(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          assert apk.stat().st_size == meta['unsignedSize'] and sha256(apk) == meta['unsignedSha256']
          tag = 'rawline-' + meta['versionName'] + (f'+r{meta["revision"]}' if meta['revision'] > 2 else '')
          def api(path, data=None, method=None, content_type='application/json'):
              payload = json.dumps(data).encode() if isinstance(data, dict) else data
              url = path if path.startswith('https://') else 'https://api.github.com/' + path
              request = urllib.request.Request(url, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'Content-Type': content_type, 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.load(response)
          def absent(path):
              try:
                  api(path)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return
                  raise
              raise RuntimeError('Tag or release already exists; nothing will be overwritten. Inspect it manually.')
          absent(f'repos/{repo}/releases/tags/{tag}')
          absent(f'repos/{repo}/git/ref/tags/{tag}')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          def inspect(path):
              badging = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', str(path)], text=True)
              package = re.search(r"^package: name='([^']+)' versionCode='([0-9]+)' versionName='([^']+)'", badging, re.M)
              sdk = re.search(r"^(?:minSdkVersion|sdkVersion):'([0-9]+)'", badging, re.M)
              native = re.search(r'^native-code: (.+)$', badging, re.M)
              assert package and sdk and native
              assert package.groups() == ('app.rawline.mobile', str(meta['versionCode']), meta['versionName'])
              assert int(sdk[1]) == meta['minSdk'] == 24 and native[1].strip() == "'arm64-v8a'"
              with zipfile.ZipFile(path) as archive:
                  libraries = [n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so')]
                  assert len(libraries) == len(set(libraries)) == 19
                  assert 'lib/arm64-v8a/librawline.so' in libraries
                  assert any(n.startswith('lib/arm64-v8a/') for n in archive.namelist())
                  assert not any(n.startswith(('lib/armeabi-v7a/', 'lib/x86', 'lib/riscv')) for n in archive.namelist())
          inspect(apk)
          assert subprocess.run([str(tools / 'apksigner'), 'verify', str(apk)], capture_output=True).returncode != 0
          name = f'RawlineBratiki-{meta["versionName"]}-r{meta["revision"]}-arm64-v8a.apk'
          signed = Path(name)
          for key in ('SIGNING_KEYSTORE_B64', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_PASSWORD', 'SIGNING_KEY_ALIAS'):
              assert os.environ.get(key), f'Missing release environment secret: {key}'
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
              key = Path(folder) / 'release.keystore'
              key.write_bytes(base64.b64decode(os.environ['SIGNING_KEYSTORE_B64'], validate=True))
              key.chmod(0o600)
              certificate = subprocess.check_output(['keytool', '-exportcert', '-keystore', str(key),
                  '-storepass:env', 'SIGNING_STORE_PASSWORD', '-alias', os.environ['SIGNING_KEY_ALIAS']])
              assert hashlib.sha256(certificate).hexdigest() == expected_signer, 'Wrong installed-mod signing certificate'
              aligned = Path(folder) / 'aligned.apk'
              subprocess.run([str(tools / 'zipalign'), '-P', '16', '-f', '4', str(apk), str(aligned)], check=True)
              subprocess.run([str(tools / 'apksigner'), 'sign', '--ks', str(key), '--ks-key-alias', os.environ['SIGNING_KEY_ALIAS'],
                  '--ks-pass', 'env:SIGNING_STORE_PASSWORD', '--key-pass', 'env:SIGNING_KEY_PASSWORD',
                  '--out', str(signed), str(aligned)], check=True)
          verified = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(signed)], text=True)
          certs = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]+)', verified)
          assert len(certs) == 1 and certs[0].lower() == expected_signer
          inspect(signed)
          asset = {'name': name, 'size': signed.stat().st_size, 'sha256': sha256(signed)}
          manifest = {'schema': 1, 'packageName': 'app.rawline.mobile', 'channel': 'stable',
              'versionName': meta['versionName'], 'versionCode': meta['versionCode'], 'minSdk': meta['minSdk'],
              'coreRef': meta['upstream']['coreRef'], 'signerSha256': expected_signer, 'assets': {'arm64-v8a': asset}}
          body = (f'Rawline Bratiki {meta["versionName"]}, revision {meta["revision"]}.\n\n'
              f'GPL source: https://github.com/{repo}/tree/{meta["sourceSha"]}\n'
              f'Source archive: https://github.com/{repo}/archive/{meta["sourceSha"]}.tar.gz\n'
              f'Upstream: {meta["upstream"]["repository"]} at {meta["upstream"]["commit"]}.\n'
              f'Unsigned build: https://github.com/{repo}/actions/runs/{meta["runId"]}\n\n'
              '<!-- rawline-update\n' + json.dumps(manifest, separators=(',', ':')) + '\n-->\n')
          # Draft-first makes partial uploads non-public. Failures require explicit manual draft/tag cleanup;
          # this workflow never replaces an asset or resumes a release with ambiguous provenance.
          release = api(f'repos/{repo}/releases', {'tag_name': tag, 'target_commitish': meta['sourceSha'],
              'name': f'Rawline Bratiki {meta["versionName"]}', 'body': body, 'draft': True, 'prerelease': False})
          upload = release['upload_url'].split('{', 1)[0] + '?name=' + name
          uploaded = api(upload, signed.read_bytes(), content_type='application/vnd.android.package-archive')
          assert uploaded['name'] == name and uploaded['size'] == asset['size']
          assert uploaded.get('digest') == 'sha256:' + asset['sha256'], 'Uploaded asset digest mismatch'
          published = api(f'repos/{repo}/releases/{release["id"]}', {'draft': False}, method='PATCH')
          assert not published['draft']
          print(published['html_url'])
          PY
